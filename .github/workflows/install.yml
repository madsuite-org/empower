name: Install

# Runs the published one-line installer, then opfsolve, on each supported
# platform against the latest release.
on:
  # Called by the Release workflow once a release is published: a release
  # created with GITHUB_TOKEN does not trigger the `release` event.
  workflow_call:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install.yml]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# CI has no HSL licence: install without HSL and run with an explicit MUMPS.
env:
  OPFSOLVE_SKIP_HSL: "1"

jobs:
  native:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: One-line install
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh -s -- -y
      - name: opfsolve in a new shell
        run: |
          # A new shell reads the startup files the installer edited.
          if [ "$RUNNER_OS" = macOS ]; then sh_new="zsh -ic"; else sh_new="bash -lic"; fi
          $sh_new 'opfsolve case14_ieee case118_ieee --options=linear_solver=mumps'
          cat opfsolve-results/summary.csv opfsolve-results/system.txt
          test "$(grep -c LOCALLY_SOLVED opfsolve-results/summary.csv)" = 2
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.runner }}
          path: opfsolve-results

  windows:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: One-line install, then opfsolve in the same session
        shell: powershell
        run: |
          $env:OPFSOLVE_YES = '1'
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
          opfsolve case14_ieee case118_ieee --options=linear_solver=mumps
          Get-Content opfsolve-results\summary.csv, opfsolve-results\system.txt
          if ((Select-String -Pattern LOCALLY_SOLVED -Path opfsolve-results\summary.csv).Count -ne 2) { exit 1 }
      - name: The user PATH lists opfsolve for future sessions
        shell: powershell
        run: |
          $p = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($p -split ';' | Where-Object { $_ -eq (Join-Path $HOME '.opfsolve\bin') })) { exit 1 }

  container:
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:8
            deps: dnf install -y tar
          - image: rockylinux:9
            deps: dnf install -y tar
          - image: fedora:latest
            deps: dnf install -y tar
          - image: debian:12
            deps: apt-get update && apt-get install -y curl ca-certificates
          - image: ubuntu:20.04
            deps: apt-get update && apt-get install -y curl ca-certificates
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.deps }}
      - name: One-line install
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh -s -- -y
      - name: opfsolve in a new shell
        run: |
          bash -lic 'opfsolve case14_ieee case118_ieee --options=linear_solver=mumps'
          cat opfsolve-results/summary.csv
          test "$(grep -c LOCALLY_SOLVED opfsolve-results/summary.csv)" = 2
