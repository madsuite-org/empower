name: Install

# Runs the published one-line installer, then empower, on each supported
# platform against the latest release.
on:
  # Called by the Release workflow once a release is published (a release
  # created with GITHUB_TOKEN does not trigger the `release` event), with the
  # released commit, so the installers tested are the ones of that release.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install.yml]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI has no HSL licence: install without HSL and run with an explicit MUMPS.
  EMPOWER_SKIP_HSL: "1"
  RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ inputs.ref || github.sha }}

jobs:
  native:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: One-line install
        run: curl --proto '=https' --tlsv1.2 -fsSL "$RAW/install.sh" | sh -s -- -y
      - name: empower in a new shell
        run: |
          # A new shell reads the startup files the installer edited.
          if [ "$RUNNER_OS" = macOS ]; then sh_new="zsh -ic"; else sh_new="bash -lic"; fi
          $sh_new 'empower case14_ieee case118_ieee --options=linear_solver=mumps'
          cat empower-results/summary.csv empower-results/system.txt
          test "$(grep -c LOCALLY_SOLVED empower-results/summary.csv)" = 2
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: results-${{ matrix.runner }}
          path: empower-results

  windows:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: One-line install, then empower in the same session
        shell: powershell
        run: |
          $env:EMPOWER_YES = '1'
          irm "$env:RAW/install.ps1" | iex
          empower case14_ieee case118_ieee --options=linear_solver=mumps
          Get-Content empower-results\summary.csv, empower-results\system.txt
          if ((Select-String -Pattern LOCALLY_SOLVED -Path empower-results\summary.csv).Count -ne 2) { exit 1 }
      - name: The user PATH lists empower for future sessions
        shell: powershell
        run: |
          $p = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($p -split ';' | Where-Object { $_ -eq (Join-Path $HOME '.empower\bin') })) { exit 1 }

  container:
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:8
            deps: dnf install -y tar
          - image: rockylinux:9
            deps: dnf install -y tar
          - image: fedora:latest
            deps: dnf install -y tar
          - image: debian:12
            deps: apt-get update && apt-get install -y curl ca-certificates
          - image: ubuntu:20.04
            deps: apt-get update && apt-get install -y curl ca-certificates
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.deps }}
      - name: One-line install
        run: curl --proto '=https' --tlsv1.2 -fsSL "$RAW/install.sh" | sh -s -- -y
      - name: empower in a new shell
        run: |
          bash -lic 'empower case14_ieee case118_ieee --options=linear_solver=mumps'
          cat empower-results/summary.csv
          test "$(grep -c LOCALLY_SOLVED empower-results/summary.csv)" = 2

  # Re-running, an install directory with spaces, the PATH block, and uninstall.
  lifecycle:
    name: reinstall, spaces, uninstall
    runs-on: ubuntu-24.04
    steps:
      - name: Install into a directory with a space, twice
        run: |
          for i in 1 2; do
            curl --proto '=https' --tlsv1.2 -fsSL "$RAW/install.sh" | sh -s -- -y --path "$HOME/my opf"
          done
          test "$(grep -c '>>> empower initialize >>>' ~/.bashrc)" = 1
      - name: empower in a new shell
        run: |
          bash -lic 'empower case14_ieee --options=linear_solver=mumps'
          grep -q LOCALLY_SOLVED empower-results/summary.csv
      - name: Uninstall
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "$RAW/install.sh" | sh -s -- -y --path "$HOME/my opf" --uninstall
          test ! -e "$HOME/my opf"
          ! grep -q 'empower initialize' ~/.bashrc ~/.profile
      - name: Help works when piped
        run: curl --proto '=https' --tlsv1.2 -fsSL "$RAW/install.sh" | sh -s -- --help | grep -q 'Options:'
