name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: ${{ matrix.plat }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - plat: linux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    # AlmaLinux 8 (glibc 2.28), so the binary also runs on RHEL 8 and newer distributions.
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for IDAES Ipopt
        run: dnf install -y libgfortran lapack blas libgomp
      - name: Install Julia
        run: |
          curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Build
        run: tools/build.sh "${{ matrix.plat }}"
      - name: Test
        run: tools/test.sh "${{ matrix.plat }}"
      - uses: actions/upload-artifact@v5
        with:
          name: opfsolve-${{ matrix.plat }}
          path: opfsolve-${{ matrix.plat }}.tar.gz

  build-macos:
    name: ${{ matrix.plat }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: macos-aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Build
        run: tools/build.sh "${{ matrix.plat }}"
      - name: Test
        run: tools/test.sh "${{ matrix.plat }}"
      - uses: actions/upload-artifact@v5
        with:
          name: opfsolve-${{ matrix.plat }}
          path: opfsolve-${{ matrix.plat }}.tar.gz

  build-windows:
    name: windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Build
        run: tools/build.sh windows-x86_64
      - name: Test
        shell: pwsh
        run: tools/test.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: opfsolve-windows-x86_64
          path: opfsolve-windows-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
